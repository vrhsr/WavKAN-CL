# ---------------------------------------------------------------------------
# final_component_ablation.yaml
#
# Phase 10 -- component ablation on the ADOPTED architecture.
#
# WHY THIS EXPERIMENT EXISTS
# --------------------------
# The manuscript's central architectural claim is that physiology-constrained
# wavelet initialisation (PCWI) is the component that measurably helps. That
# claim currently rests on Table IV, whose every row varies one component of the
# BASE configuration (use_rr_attn=True). The architecture the paper actually
# adopts is use_rr_attn=False, and no PCWI-off run exists for it: a scan of every
# trained configuration in results/ confirms there is no arm with
# use_pcwi=False AND use_rr_attn=False. So the paper's primary contribution has
# only ever been ablated on a configuration it abandoned.
#
# REVISION 2 (2026-09-28, AUDIT_FINDINGS.md H49). The first run of this job
# (2026-09-26, preserved at results/final_component_ablation_INVALID_pre_h16_split/)
# is not usable: this config's expected counts had been copied from the
# manuscript's stale class table, which describes the PRE-H16 split (validation
# 215/220/223/230). Every published arm was trained on split.py's split
# (validation 208/209/223/230) -- proven by re-evaluating their checkpoints,
# which reproduce their own recorded validation scores only on that split.
# The preflight therefore rejected the GPU box's correct data for three weeks,
# the box was made to pass by regenerating the pre-H16 split, and the three arms
# were trained and selected on different records from the arm they were
# compared against (the new arms saw 399 fusion training beats, the reference
# 28). Three changes make that impossible to repeat:
#   1. expected counts now equal configs/mitbih_split_counts.json, derived from
#      the PhysioNet annotations; the runner refuses a config that disagrees;
#   2. data_equivalence: before any training, the 20 published reference
#      checkpoints must reproduce their own recorded validation and test
#      Macro-F1 on this machine's arrays -- the only check that measures the
#      data itself rather than its labels;
#   3. reference_replicate: the published configuration is re-trained in this
#      same job, and every ablation is compared against it first, so no
#      machine, library or time difference can masquerade as a component effect.
#
# Arms, all on the adopted architecture:
#   reference_replicate -- the published configuration, re-trained here (comparator)
#   no_pcwi             -- use_pcwi=False                  (is PCWI useful at all?)
#   prior_swap_pt       -- P and T priors swapped           (is the benefit physiological?)
#   no_pwam             -- no gated P-region pathway        (closes Limitations item 9)
# Each differs from reference_replicate in exactly one flag.
#
# The published reference arm (results/ablation_no_rr_attn/) is read-only: it is
# never overwritten, and is used for the data-equivalence gate and the drift check.
# ---------------------------------------------------------------------------

experiment:
  name: final_component_ablation
  phase: 10
  # Directory created under results/. Never overwritten: the runner refuses to
  # start if a completed run is already present unless --allow-resume is given,
  # in which case it skips only the seeds that already finished.
  output_root: results/final_component_ablation

  # The already-published arm every new arm is compared against. Read-only.
  reference_arm:
    name: pcwi_pwam_on
    dir: results/ablation_no_rr_attn
    expect_seeds: 20
    expect_params: 153045
    description: >
      Adopted architecture (PCWI on, gated P-region fusion on, MLP rhythm
      encoder, Mexican Hat basis, RAC curriculum, augmentation on).

  # The arm every ablation is compared against FIRST. It is the published
  # configuration re-trained in this job, so the comparison is within one batch.
  within_batch_reference: reference_replicate

# ---------------------------------------------------------------------------
# Data equivalence (preflight 2b). The published reference checkpoints,
# best_model.pth + training_history.json + test_metrics.json, are all
# git-tracked, so a `git pull` is enough. Each is re-evaluated on this
# machine's arrays and must reproduce its own saved test Macro-F1 and its
# recorded best-epoch validation Macro-F1 to within the tolerance. On the
# published arrays reproduction is exact (verified 2026-09-28 by local
# regeneration: 20/20 test predictions identical beat-for-beat, 19/20
# validation scores identical to 4 dp). The wrong split moves them by 0.02-0.2.
# ---------------------------------------------------------------------------
data_equivalence:
  reference_dir: results/ablation_no_rr_attn
  model_kwargs: {use_pcwi: true, use_pwam: true, use_rr_attn: false}
  seeds: all
  tolerance_macro_f1: 0.002     # a few argmax ties on a different GPU; never relax to pass
  batch_size: 256               # memory only; numerically irrelevant in eval mode
  # H50: seed 1001's checkpoint reproduces its saved test predictions exactly but
  # does not reproduce its own recorded validation score on either candidate
  # validation set, so it cannot vouch for the validation arrays. Test is still
  # checked for it.
  val_exempt_seeds: [1001]

# ---------------------------------------------------------------------------
# Arms to train. Each is one flag away from the reference arm.
# ---------------------------------------------------------------------------
arms:
  - name: reference_replicate
    priority: essential
    flags: ["--no-rr-attn"]
    expect_params: 153045
    protects_claim: >
      Every comparison below. It is the published configuration trained in this
      same job, so arm-vs-replicate differences cannot be machine, library, data
      or time effects. Its own comparison with the published arm is the drift
      check that says whether the published numbers can be paired with new runs.

  - name: no_pcwi
    priority: essential
    flags: ["--no-pcwi", "--no-rr-attn"]
    expect_params: 153045          # PCWI changes initialisation, not shape
    protects_claim: >
      "PCWI is the only novel component of the architecture with a corrected
      large positive effect" -- Introduction contribution 1, Results Sec. V-A,
      Discussion Sec. VI-A. Currently measured on the base configuration only.

  - name: prior_swap_pt
    priority: essential
    flags: ["--prior-assignment", "swap_pt", "--no-rr-attn"]
    expect_params: 153045          # identical shape; only the mapping changes
    protects_claim: >
      The word "physiology" in the method name, the title and Introduction
      contribution 1. Removing PCWI entirely compares a structured three-group
      multi-scale initialisation against one isotropic scale, which cannot
      separate (A) genuine morphology information in the priors from (B) a
      generic benefit of heterogeneous multi-scale initialisation. This arm
      keeps the channel groups, the exact set of prior values and every
      training detail, and permutes only which group receives which prior
      (P and T are both 16-channel blocks, so block size is exactly preserved).
      If the physiological assignment is not better than the permuted one, the
      benefit is structural and the manuscript must not attribute it to
      morphology. Until this runs, the manuscript states the limitation
      explicitly (Limitations item 9) rather than assuming the answer.

  - name: no_pwam
    priority: high
    flags: ["--no-pwam", "--no-rr-attn"]
    expect_params: 118229          # removing the P-region pathway drops ~34.8K
    protects_claim: >
      Limitations item (9): the P-region pathway was ablated only on the base
      configuration. Running it here retires that caveat entirely rather than
      leaving half of it open.

  # Optional. The paper reports the mother wavelet as interchangeable, which is
  # a null result already established on the base configuration; re-verifying a
  # null is legitimate future work rather than a publication blocker. Enable
  # with --include-optional only if GPU time is genuinely free.
  - name: basis_bspline
    priority: optional
    enabled: false
    flags: ["--wavelet", "b_spline", "--no-rr-attn"]
    expect_params: 153045
    protects_claim: >
      "The mother wavelet is interchangeable" (Results Sec. V-A), currently
      established on the base configuration.

# ---------------------------------------------------------------------------
# Training recipe. These values are NOT free choices: every one of them is
# copied from the reference arm so the comparison is single-variable. Changing
# any of them invalidates the comparison against results/ablation_no_rr_attn/.
# Source of truth: src/train_pca.py argument defaults, cross-checked against the
# recipe described in the manuscript's Experimental Setup section.
# ---------------------------------------------------------------------------
training:
  epochs: 100
  patience: 15                 # early stopping on validation Macro-F1
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4         # train_pca.py default
  optimizer: AdamW
  scheduler: CosineAnnealingLR # T_max = epochs
  grad_clip_norm: 1.0
  warmup: 0.25                 # RAC warm-up fraction
  focal_gamma: 2.0
  s_weight: 8.0                # extra S-class loss weight
  wavelet: mexican_hat
  use_curriculum: true         # RAC on, as in the reference arm
  use_augment: true            # augmentation on, as in the reference arm
  checkpoint_rule: best_validation_macro_f1
  select_on: DS1_validation_only   # DS2 is never read during training

# The exact 20 seeds of every published arm. Paired statistics require these
# identities, not merely this count -- see src/paired_stats.py (H8a/H8b).
seeds: [42, 101, 777, 2026, 9999, 1234, 2024, 31415, 27182, 7,
        11, 13, 888, 555, 333, 99, 1001, 5050, 8080, 1998]

# ---------------------------------------------------------------------------
# Data. Regenerate with:  python src/process_data.py
# ---------------------------------------------------------------------------
data:
  dir: data/processed_rr_history
  required_files:
    - X_train.npy
    - X_rr_train.npy
    - y_train.npy
    - X_val.npy
    - X_rr_val.npy
    - y_val.npy
    - X_test.npy
    - X_rr_test.npy
    - y_test.npy
  # Preflight asserts these exactly; a mismatch means the wrong preprocessing
  # was run and the results would not be comparable to the published arms.
  # Must equal configs/mitbih_split_counts.json (derived from the PhysioNet
  # annotations by src/derive_split_counts.py); the runner refuses to start
  # otherwise, and tests/test_split_counts.py pins it. These are split.py's
  # split: validation = records 208, 209, 223, 230. (The previous values,
  # 40726/10266, were the pre-H16 split -- H49.)
  expect_beats: {train: 40177, val: 10815, test: 49684}
  expect_class_counts:
    train: {0: 37337, 1: 485,  2: 2321, 3: 28,  4: 6}
    val:   {0: 8502,  1: 458,  2: 1467, 3: 386, 4: 2}
    test:  {0: 44232, 1: 1837, 2: 3220, 3: 388, 4: 7}
  beat_length: 360
  rr_length: 5
  n_classes: 5

# ---------------------------------------------------------------------------
# Statistics computed after training, against the reference arm.
# ---------------------------------------------------------------------------
statistics:
  # One Holm family per arm, across these five metrics. Matches the manuscript's
  # declared families (Sec. IV-F).
  metrics: [macro_f1, v_recall, s_recall, f_recall, n_recall]
  test: wilcoxon_signed_rank
  alternative: two-sided
  correction: holm_bonferroni
  effect_size: cohens_d_paired
  ci: 0.95
  # positive d favours the REFERENCE (replicate for the primary family,
  # published arm for the secondary), i.e. favours keeping the component.
  sign_convention: reference_minus_variant
  implementation: src/paired_stats.py

environment:
  python: ">=3.9"
  torch: ">=2.0"
  cuda: ">=11.8"
  packages: [torch, numpy, scipy, scikit-learn, matplotlib, tqdm, pyyaml]
  deterministic:
    # train_pca.py seeds torch and numpy per run. cuDNN autotuning is left on
    # because the published reference arm was trained that way; forcing
    # determinism here would make this arm differently-conditioned from the arm
    # it is compared against, which matters more than bitwise reproducibility.
    torch_manual_seed: per_run
    numpy_seed: per_run
    cudnn_deterministic: false
    note: matches the reference arm's conditions -- do not change
